<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日文50音自學教室 | 高中生日語學習</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #E63946;
            --secondary: #457B9D;
            --accent: #F4A261;
            --bg: #FEFAE0;
            --surface: #FFFFFF;
            --text-primary: #1D3557;
            --text-secondary: #6B7280;
            --hiragana: #E63946;
            --katakana: #457B9D;
            --shadow: 0 4px 20px rgba(29, 53, 87, 0.1);
            --shadow-hover: 0 8px 30px rgba(29, 53, 87, 0.15);
            --radius: 12px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .sakura-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .sakura {
            position: absolute;
            width: 12px;
            height: 12px;
            background: linear-gradient(135deg, #FFB7C5 0%, #FF69B4 100%);
            border-radius: 50% 0 50% 50%;
            opacity: 0.4;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.4;
            }
            90% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(254, 250, 224, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px 24px;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo svg {
            width: 40px;
            height: 40px;
        }

        .logo h1 {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .font-toggle {
            display: flex;
            background: var(--surface);
            border-radius: 25px;
            padding: 4px;
            box-shadow: var(--shadow);
        }

        .font-toggle button {
            padding: 8px 16px;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s ease;
            color: var(--text-secondary);
        }

        .font-toggle button.active {
            background: var(--primary);
            color: white;
        }

        .font-toggle button:hover:not(.active) {
            background: rgba(230, 57, 70, 0.1);
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 24px 64px;
            position: relative;
            z-index: 1;
        }

        .hero {
            text-align: center;
            padding: 48px 24px;
            background: linear-gradient(135deg, rgba(230, 57, 70, 0.05) 0%, rgba(69, 123, 157, 0.05) 100%);
            border-radius: var(--radius);
            margin-bottom: 32px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(230, 57, 70, 0.03) 0%, transparent 70%);
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .hero h2 {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 16px;
            color: var(--text-primary);
            position: relative;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto 24px;
        }

        .random-card {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 48px;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .random-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .random-card .char {
            font-size: 4rem;
            line-height: 1;
            margin-bottom: 8px;
            transition: transform 0.2s ease;
        }

        .random-card .romaji {
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 2px solid rgba(29, 53, 87, 0.1);
            padding-bottom: 0;
            overflow-x: auto;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            color: var(--text-secondary);
            position: relative;
            white-space: nowrap;
            transition: color 0.3s ease;
        }

        .tab-btn::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--primary);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .tab-btn.active {
            color: var(--primary);
            font-weight: 600;
        }

        .tab-btn.active::after {
            transform: scaleX(1);
        }

        .tab-btn:hover:not(.active) {
            color: var(--text-primary);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 28px;
            background: var(--primary);
            border-radius: 2px;
        }

        .syllabary-table {
            margin-bottom: 32px;
        }

        .syllabary-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .syllabary-row {
            display: contents;
        }

        .syllabary-row-wrapper {
            display: flex;
            align-items: stretch;
            margin-bottom: 8px;
        }

        .syllabary-row-wrapper .row-label {
            width: 70px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
            background: rgba(29, 53, 87, 0.08);
            border-radius: var(--radius-sm);
            margin-right: 8px;
        }

        .syllabary-card {
            aspect-ratio: 1;
            min-height: 56px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--surface);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
        }

        .syllabary-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .syllabary-card:active {
            transform: scale(0.95);
        }

        .syllabary-card.highlight {
            animation: highlightPulse 1s ease infinite;
        }

        @keyframes highlightPulse {
            0%, 100% { box-shadow: 0 0 0 3px var(--accent); }
            50% { box-shadow: 0 0 0 6px rgba(244, 162, 97, 0.5); }
        }

        .syllabary-card.empty {
            background: rgba(29, 53, 87, 0.03);
            box-shadow: none;
            cursor: default;
            opacity: 0.5;
        }

        .syllabary-card .main-char {
            font-size: 1.8rem;
            line-height: 1;
            font-weight: 500;
        }

        .syllabary-card .sub-char {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .syllabary-card .romaji {
            font-size: 0.75rem;
            color: var(--text-secondary);
            opacity: 0.7;
        }

        .row-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .syllabary-wrapper {
            display: flex;
            gap: 16px;
        }

        .syllabary-row-labels {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .quiz-section {
            background: linear-gradient(135deg, var(--primary) 0%, #C1121F 100%);
            padding: 32px;
            border-radius: var(--radius);
            color: white;
            text-align: center;
            margin-top: 32px;
        }

        .quiz-section h3 {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 16px;
        }

        .quiz-section p {
            opacity: 0.9;
            margin-bottom: 24px;
        }

        .quiz-btn {
            padding: 14px 32px;
            background: white;
            color: var(--primary);
            border: none;
            border-radius: 25px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quiz-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .vocab-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .vocab-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .vocab-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .vocab-japanese {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .vocab-reading {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .vocab-actions {
            display: flex;
            gap: 8px;
        }

        .vocab-actions button {
            width: 36px;
            height: 36px;
            border: none;
            background: rgba(29, 53, 87, 0.05);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .vocab-actions button:hover {
            background: rgba(29, 53, 87, 0.1);
        }

        .vocab-actions button.sound-btn:hover {
            background: rgba(230, 57, 70, 0.1);
        }

        .vocab-actions button.favorite-btn.active {
            background: rgba(230, 57, 70, 0.1);
            color: var(--primary);
        }

        .vocab-chinese {
            font-size: 1rem;
            color: var(--secondary);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .vocab-example {
            font-size: 0.9rem;
            color: var(--text-secondary);
            background: rgba(29, 53, 87, 0.03);
            padding: 12px;
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--primary);
        }

        .vocab-category {
            display: inline-block;
            padding: 4px 12px;
            background: var(--secondary);
            color: white;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-bottom: 12px;
        }

        .category-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }

        .category-btn {
            padding: 8px 16px;
            border: 2px solid rgba(29, 53, 87, 0.1);
            background: transparent;
            border-radius: 20px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-secondary);
        }

        .category-btn.active {
            border-color: var(--secondary);
            background: var(--secondary);
            color: white;
        }

        .category-btn:hover:not(.active) {
            border-color: var(--secondary);
            color: var(--secondary);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(29, 53, 87, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 24px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 32px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal h3 {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 24px;
        }

        .quiz-question {
            font-size: 4rem;
            margin-bottom: 24px;
            color: var(--primary);
        }

        .quiz-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .quiz-option {
            padding: 16px;
            border: 2px solid rgba(29, 53, 87, 0.1);
            background: transparent;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .quiz-option:hover {
            border-color: var(--secondary);
            background: rgba(69, 123, 157, 0.1);
        }

        .quiz-option.correct {
            border-color: #10B981;
            background: rgba(16, 185, 129, 0.1);
            color: #10B981;
        }

        .quiz-option.wrong {
            border-color: var(--primary);
            background: rgba(230, 57, 70, 0.1);
            color: var(--primary);
        }

        .quiz-score {
            font-size: 2rem;
            margin-bottom: 16px;
        }

        .quiz-nav {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .quiz-nav button {
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .quiz-nav .next-btn {
            background: var(--primary);
            color: white;
        }

        .quiz-nav .close-btn {
            background: rgba(29, 53, 87, 0.1);
            color: var(--text-primary);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border: none;
            background: rgba(29, 53, 87, 0.05);
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: rgba(29, 53, 87, 0.1);
            color: var(--text-primary);
        }

        .favorites-section {
            margin-top: 32px;
            padding-top: 32px;
            border-top: 2px dashed rgba(29, 53, 87, 0.1);
        }

        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        footer {
            text-align: center;
            padding: 32px 24px;
            background: rgba(29, 53, 87, 0.03);
            margin-top: 64px;
            position: relative;
            z-index: 1;
        }

        .tip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: var(--surface);
            border-radius: 25px;
            box-shadow: var(--shadow);
            color: var(--text-secondary);
        }

        .tip svg {
            color: var(--accent);
        }

        @media (max-width: 768px) {
            header {
                padding: 12px 16px;
            }

            .header-content {
                justify-content: center;
            }

            .logo h1 {
                font-size: 1.2rem;
            }

            .font-toggle button {
                padding: 6px 12px;
                font-size: 0.8rem;
            }

            main {
                padding: 80px 16px 48px;
            }

            .hero h2 {
                font-size: 1.8rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .random-card {
                padding: 16px 32px;
            }

            .random-card .char {
                font-size: 3rem;
            }

            .tabs {
                gap: 0;
            }

            .tab-btn {
                padding: 10px 16px;
                font-size: 0.9rem;
            }

            .syllabary-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 6px;
            }

            .syllabary-row-wrapper {
                flex-direction: column;
                align-items: stretch;
            }

            .syllabary-row-wrapper .row-label {
                width: auto;
                margin-right: 0;
                margin-bottom: 4px;
                font-size: 0.8rem;
            }

            .syllabary-card .main-char {
                font-size: 1.4rem;
            }

            .syllabary-card .romaji {
                font-size: 0.65rem;
            }

            .vocab-grid {
                grid-template-columns: 1fr;
            }

            .quiz-section {
                padding: 24px 16px;
            }

            .quiz-question {
                font-size: 3rem;
            }

            .quiz-options {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .syllabary-card .main-char {
                font-size: 1.2rem;
            }

            .syllabary-card .sub-char,
            .syllabary-card .romaji {
                display: none;
            }
        }

        .play-animation {
            animation: playSound 0.3s ease;
        }

        @keyframes playSound {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="sakura-container" id="sakuraContainer"></div>

    <header>
        <div class="header-content">
            <div class="logo">
                <svg viewBox="0 0 100 100" fill="none">
                    <circle cx="50" cy="50" r="45" stroke="#E63946" stroke-width="3"/>
                    <path d="M50 20C50 20 30 40 30 55C30 70 40 80 50 80C60 80 70 70 70 55C70 40 50 20 50 20Z" fill="#E63946"/>
                    <path d="M50 20C50 20 40 35 40 50C40 65 45 75 50 80" stroke="#C1121F" stroke-width="2"/>
                </svg>
                <h1>日文50音自學教室</h1>
            </div>
            <div class="font-toggle">
                <button class="active" data-type="hiragana">平假名</button>
                <button data-type="katakana">片假名</button>
                <button data-type="both">両方</button>
            </div>
        </div>
    </header>

    <main>
        <section class="hero">
            <h2>開始你的日語學習之旅</h2>
            <p>點擊下方卡片，聆聽發音，開始認識優雅的日文假名吧！</p>
            <div class="random-card" id="randomCard" onclick="playRandom()">
                <span class="char" id="randomChar">あ</span>
                <span class="romaji">a</span>
            </div>
        </section>

        <div class="tabs">
            <button class="tab-btn active" data-tab="basic">清音</button>
            <button class="tab-btn" data-tab="dakuon">濁音・半濁音</button>
            <button class="tab-btn" data-tab="vocab">日常單字</button>
        </div>

        <div class="tab-content active" id="tab-basic">
            <h3 class="section-title">五十音表（清音）</h3>
            <div class="syllabary-table" id="basicGrid"></div>
            <div class="quiz-section">
                <h3>覺得自己記住了嗎？</h3>
                <p>來挑戰一下聽力測驗，看看自己能答對幾題！</p>
                <button class="quiz-btn" onclick="startQuiz('basic')">開始測驗</button>
            </div>
        </div>

        <div class="tab-content" id="tab-dakuon">
            <h3 class="section-title">濁音與半濁音</h3>
            <div class="syllabary-table" id="dakuonGrid"></div>
        </div>

        <div class="tab-content" id="tab-vocab">
            <h3 class="section-title">日常會話單字</h3>
            <div class="category-filter">
                <button class="category-btn active" data-category="all">全部</button>
                <button class="category-btn" data-category="greetings">問候</button>
                <button class="category-btn" data-category="food">食物</button>
                <button class="category-btn" data-category="number">數字</button>
                <button class="category-btn" data-category="time">時間</button>
                <button class="category-btn" data-category="transport">交通</button>
                <button class="category-btn" data-category="shopping">購物</button>
            </div>
            <div class="vocab-grid" id="vocabGrid"></div>
            
            <div class="favorites-section" id="favoritesSection" style="display: none;">
                <h3 class="section-title">我的收藏</h3>
                <div class="vocab-grid" id="favoritesGrid"></div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="quizModal">

        function getDisplayChar(char) {
            const allHiragana = syllabary.basic.flatMap(row => row.chars);
            const allKatakana = syllabary.katakana.flatMap(row => row.chars);
            
            if (currentFontType === 'hiragana') {
                return char;
            } else if (currentFontType === 'katakana') {
                const hiraganaIndex = allHiragana.indexOf(char);
                if (hiraganaIndex !== -1) {
                    return allKatakana[hiraganaIndex];
                }
                const dakuonHiragana = syllabary.dakuon.hiragana.flatMap(row => row.chars);
                const dakuonKatakana = syllabary.dakuon.katakana.flatMap(row => row.chars);
                const dakuonIndex = dakuonHiragana.indexOf(char);
                if (dakuonIndex !== -1) {
                    return dakuonKatakana[dakuonIndex];
                }
                return char;
            } else {
                const hiraganaIndex = allHiragana.indexOf(char);
                if (hiraganaIndex !== -1) {
                    return hiraganaIndex % 2 === 0 ? char : allKatakana[hiraganaIndex];
                }
                return char;
            }
        }

        function getCategoryName(category) {
            const names = {
                greetings: '問候',
                food: '食物',
                number: '數字',
                time: '時間',
                transport: '交通',
                shopping: '購物'
            };
            return names[category] || category;
        }

        function playSound(char) {
            const utterance = new SpeechSynthesisUtterance(char);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.8;
            speechSynthesis.speak(utterance);

            const card = event.currentTarget;
            card.classList.add('play-animation');
            setTimeout(() => card.classList.remove('play-animation'), 300);
        }

        function playVocabSound(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.7;
            speechSynthesis.speak(utterance);
        }

                : syllabary.dakuon.hiragana.flatMap(row => row.chars);
            
            const shuffled = [...allChars].sort(() => Math.random() - 0.5);
            quizData = shuffled.slice(0, Math.min(10, shuffled.length));
            currentQuestion = 0;
            score = 0;
            
            showQuestion();

        function showQuestion() {

                const btn = document.createElement('button');
                btn.className = 'quiz-option';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(btn, opt, correctAnswer);
                optionsContainer.appendChild(btn);
            });

            setTimeout(() => {
                playSound(char);
            }, 500);
        }

        function generateOptions(correct) {
            const allRomaji = Object.values(syllabary.romaji);
            const options = [correct];
            
            while (options.length < 4) {
                const randomRomaji = allRomaji[Math.floor(Math.random() * allRomaji.length)];
                if (!options.includes(randomRomaji)) {
                    options.push(randomRomaji);
                }
            }
            
            return options.sort(() => Math.random() - 0.5);
        }

        function checkAnswer(btn, selected, correct) {
            const options = document.querySelectorAll('.quiz-option');
            options.forEach(opt => opt.style.pointerEvents = 'none');
            
            if (selected === correct) {
                btn.classList.add('correct');
                score++;
            } else {
                btn.classList.add('wrong');
                options.forEach(opt => {
                    if (opt.textContent === correct) {
                        opt.classList.add('correct');
                    }
                });
            }
            
            document.getElementById('nextQuestion').style.display = 'inline-block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= quizData.length) {
                showResult();
            } else {
                showQuestion();
            }
        }

        function showResult() {
            document.getElementById('quizContent').style.display = 'none';
            document.getElementById('quizResult').style.display = 'block';
            document.getElementById('quizScore').textContent = `${score} / ${quizData.length}`;
            
            const messages = [
                '繼續加油！多練習幾次就能熟練了',
                '還不錯喔！再接再厲',
                '很棒了！保持這個水準',
                '太厲害了！你真的記住了！'
            ];
            const messageIndex = Math.min(Math.floor(score / quizData.length * 4), 3);
            document.getElementById('quizMessage').textContent = messages[messageIndex];
        }

        function restartQuiz() {
            startQuiz('basic');
        }

        function closeQuiz() {
            document.getElementById('quizModal').classList.remove('active');
        }

        document.querySelectorAll('.font-toggle button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.font-toggle button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFontType = btn.dataset.type;
                renderBasicGrid();
                renderDakuonGrid();
            });
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
            });
        });

        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderVocabGrid(btn.dataset.category);
            });
        });

        document.getElementById('quizModal').addEventListener('click', (e) => {
            if (e.target.id === 'quizModal') {
                closeQuiz();
            }
        });

        createSakura();
        renderBasicGrid();
        renderDakuonGrid();
        renderVocabGrid();
        renderFavorites();
    </script>
</body>
</html>
